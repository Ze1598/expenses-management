<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Management App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Expense Management</h1>
        <div id="auth-container">
            <!-- Google Sign-In button will be rendered here by auth.js -->
            <div id="google-signin-button"></div> 
            <button id="signout-button" onclick="handleSignOutClick()" style="display: none;" disabled>Sign Out</button>
            <span id="user-info" style="display: none;"></span>
        </div>
    </header>

    <main id="app-container" style="display: none;">
        
        <nav>
            <button id="nav-expenses" onclick="showView('expenses-view')">Expenses</button>
            <button id="nav-dashboard" onclick="showView('dashboard-view')">Dashboard</button>
            <button id="nav-admin" onclick="showView('admin-view')">Admin</button>
        </nav>

        <!-- Expenses View -->
        <section id="expenses-view" class="view">
            <h2>My Expenses</h2>
            <button id="show-add-expense-form-btn" onclick="showExpenseForm()">Add New Expense</button>
            
            <div id="expense-form-container" style="display: none;">
                <h3>Add/Edit Expense</h3>
                <form id="expense-form" onsubmit="handleExpenseFormSubmit(event)">
                    <input type="hidden" id="expense-id">
                    <div>
                        <label for="expense-description">Description:</label>
                        <input type="text" id="expense-description" required>
                    </div>
                    <div>
                        <label for="expense-amount">Amount:</label>
                        <input type="number" id="expense-amount" step="0.01" required>
                    </div>
                    <div>
                        <label for="expense-date">Date:</label>
                        <input type="date" id="expense-date" required>
                    </div>
                    <div>
                        <label for="expense-category">Category:</label>
                        <select id="expense-category" required>
                            <!-- Options will be populated dynamically -->
                        </select>
                    </div>
                    <button type="submit">Save Expense</button>
                    <button type="button" onclick="hideExpenseForm()">Cancel</button>
                </form>
            </div>

            <div id="expense-list-container">
                <h3>Expense List</h3>
                <div id="expense-list">
                    <!-- Expenses will be listed here -->
                    <p>Loading expenses...</p>
                </div>
            </div>
        </section>

        <!-- Dashboard View -->
        <section id="dashboard-view" class="view" style="display: none;">
            <h2>Dashboard</h2>
            <div id="dashboard-filters">
                <label for="filter-year">Year:</label>
                <select id="filter-year">
                    <!-- Populate with relevant years -->
                </select>
                <label for="filter-month">Month:</label>
                <select id="filter-month">
                    <option value="all">All Months</option>
                    <!-- Populate with months 1-12 -->
                </select>
                 <label for="filter-category">Category:</label>
                <select id="filter-category">
                     <option value="all">All Categories</option>
                    <!-- Populate with categories -->
                </select>
                <button onclick="applyDashboardFilters()">Apply Filters</button>
            </div>
            <div id="dashboard-content">
                <p>Loading dashboard data...</p>
                <!-- Analytics results will be displayed here -->
                 <div id="mtd-total"></div>
                 <div id="ytd-totals"></div>
                 <div id="mtd-by-category"></div>
            </div>
        </section>

        <!-- Admin View (Category Management) -->
        <section id="admin-view" class="view" style="display: none;">
            <h2>Admin - Manage Categories</h2>
             <button id="show-add-category-form-btn" onclick="showCategoryForm()">Add New Category</button>

            <div id="category-form-container" style="display: none;">
                <h3>Add/Edit Category</h3>
                <form id="category-form" onsubmit="handleCategoryFormSubmit(event)">
                    <input type="hidden" id="category-id">
                    <div>
                        <label for="category-name">Category Name:</label>
                        <input type="text" id="category-name" required>
                    </div>
                    <button type="submit">Save Category</button>
                    <button type="button" onclick="hideCategoryForm()">Cancel</button>
                </form>
            </div>

            <div id="category-list-container">
                <h3>Category List</h3>
                <div id="category-list">
                    <!-- Categories will be listed here -->
                    <p>Loading categories...</p>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>Expense Management App</p>
    </footer>

    <!-- Load JS files -->
    <!-- Config needs to be loaded first -->
    <script src="js/config.js"></script> 
    <!-- Then libraries (loaded async in auth.js) -->
    <!-- Then handlers and managers -->
    <script src="js/gapi_handler.js"></script>
    <script src="js/ui_manager.js"></script>
    <script src="js/analytics.js"></script>
    <!-- Auth needs gapi/gis libraries and config -->
    <script src="js/auth.js"></script> 
    <!-- Main orchestrates everything -->
    <script src="js/main.js"></script>

</body>
</html>
